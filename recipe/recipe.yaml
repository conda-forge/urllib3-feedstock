schema_version: 1

context:
  version: "2.8.0"

recipe:
  name: urllib3
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/u/urllib3/urllib3-${{ version }}.tar.gz
  sha256: 63bf2ead4c879426ebf22ef2a781eeb4aa3b4ae798a0435506f8687fd5bb9b63

build:
  number: 1
  noarch: python

outputs:
  - package:
      name: urllib3
    build:
      noarch: python
      script: ${{ PYTHON }} -m pip install . -vv
    requirements:
      host:
        - python ${{ python_min }}.*
        - hatchling >=1.27.0,<2
        - hatch-vcs >=0.4.0,<0.6.0
        - setuptools-scm >=8,<11
        - pip
      run:
        - python >=${{ python_min }}
    tests:
      - python:
          imports:
            - urllib3
          pip_check: true
          python_version:
            - ${{ python_min }}.*
            - "*"

  - package:
      name: urllib3-brotli
    build:
      noarch: python
    requirements:
      host:
        - python ${{ python_min }}.*
      run:
        - ${{ pin_subpackage("urllib3", exact=True) }}
        - brotli-python >=1.2.0
    tests:
      - python:
          pip_check: true

  - package:
      name: urllib3-zstd
    build:
      noarch: python
    requirements:
      host:
        - python ${{ python_min }}.*
      run:
        - ${{ pin_subpackage("urllib3", exact=True) }}
        #  Drop when python_min = 3.14
        - backports.zstd >=1.0.0
    tests:
      - python:
          pip_check: true

  - package:
      name: urllib3-socks
    build:
      noarch: python
    requirements:
      host:
        - python ${{ python_min }}.*
      run:
        - ${{ pin_subpackage("urllib3", exact=True) }}
        - pysocks >=1.5.6,<2.0,!=1.5.7
    tests:
      - python:
          pip_check: true

  - package:
      name: urllib3-h2
    build:
      noarch: python
    requirements:
      host:
        - python ${{ python_min }}.*
      run:
        - ${{ pin_subpackage("urllib3", exact=True) }}
        - h2 >=4,<5
    tests:
      - python:
          pip_check: true

about:
  summary: HTTP library with thread-safe connection pooling, file post, and more.
  license: MIT
  license_file: LICENSE.txt
  homepage: https://pypi.org/project/urllib3/
  documentation: https://urllib3.readthedocs.io
  repository: https://github.com/urllib3/urllib3

extra:
  recipe-maintainers:
    - shazow
    - sethmlarson
    - ocefpaf
    - pquentin
    - illia-v
